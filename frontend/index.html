<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TG-parser — вопросы по чатам</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="brand-rule"></div>

<!-- ── Экран входа ──────────────────────────────────────────────────── -->
<div id="auth-screen" class="screen">
  <div class="auth-kicker">RAG · TELEGRAM ARCHIVE · 2026</div>
  <div class="card auth-card">
    <div class="auth-eyebrow">— СВОЙ АРХИВ ПЕРЕПИСОК —</div>
    <h1>TG-parser<span class="reg-mark">®</span></h1>
    <p class="subtitle">Задавай вопросы по своим Telegram-чатам</p>
    <div class="tabs">
      <button class="tab active" data-tab="login">Войти</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <div id="auth-error" class="error hidden"></div>
    <input id="auth-login" type="text" placeholder="Логин" autocomplete="username" />
    <input id="auth-pass" type="password" placeholder="Пароль" autocomplete="current-password" />
    <button id="auth-submit" class="btn-primary">Войти</button>
  </div>
</div>

<!-- ── Главный экран ────────────────────────────────────────────────── -->
<div id="main-screen" class="screen hidden">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-kicker">● TG-PARSER</div>
      <div class="sidebar-header-row">
        <span id="user-label" class="user-label"></span>
        <button id="logout-btn" class="btn-ghost small">Выйти</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-title"><span>Чаты</span>
        <button id="upload-btn" class="btn-ghost small" title="Загрузить result.json">+ Загрузить</button>
      </div>
      <input id="file-input" type="file" accept=".json" class="hidden" />
      <div id="upload-status" class="upload-status hidden"></div>
      <ul id="chat-list" class="item-list"></ul>
    </div>

    <div class="sidebar-section">
      <div class="section-title"><span>Группы</span>
        <button id="new-group-btn" class="btn-ghost small">+ Создать</button>
      </div>
      <ul id="group-list" class="item-list"></ul>
    </div>
  </aside>

  <main class="main-panel">
    <div class="qa-header">
      <div id="scope-label" class="scope-label">Поиск по всем чатам</div>
      <button id="clear-scope-btn" class="btn-ghost small hidden">✕&nbsp;Убрать фильтр</button>
    </div>

    <div id="qa-messages" class="qa-messages"></div>

    <div class="qa-input-area">
      <textarea id="qa-input" placeholder="Задай вопрос по переписке…" rows="3"></textarea>
      <button id="qa-send-btn" class="btn-primary">Спросить</button>
    </div>
  </main>

</div>

<!-- ── Модалки ──────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-footer">
      <button id="modal-cancel" class="btn-ghost">Отмена</button>
      <button id="modal-ok" class="btn-primary">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
